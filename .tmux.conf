unbind r
bind r source-file ~/.tmux.conf
set -g default-terminal "tmux-256color"

set -g mouse on
# Set status bar to the bottom
set-option -g status-position top
set-window-option -g pane-base-index 1

set -g base-index 1
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.1' # See https://github.com/catppuccin/tmux/tags for additional tags

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_flavor "frappe"
# set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_status_background "#{@thm_bg}"
# set -g @catppuccin_status_background "none"
# Theme colours (@thm_*) from ~/dotfiles/bin/theme. The plugin only sets them if unset,
# so these win, and re-sourcing this file re-renders the status line in the new colours.
source-file -q ~/.local/state/theme/current/tmux.conf
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ogq @catppuccin_window_current_text " #W"
set -ogq @catppuccin_window_text " #W"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
